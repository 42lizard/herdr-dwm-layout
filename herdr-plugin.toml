id = "42lizard.dwm-layout"
name = "DWM Layout"
version = "0.2.0"
min_herdr_version = "0.8.2"
description = "Live-safe DWM master/stack layouts for Herdr panes"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "enable"
title = "Enable DWM layout"
description = "Manage the current tab as a DWM master/stack layout"
contexts = ["tab", "pane"]
command = ["target/release/herdr-dwm-layout", "enable"]

[[actions]]
id = "disable"
title = "Disable DWM layout"
description = "Stop automatically arranging the current tab"
contexts = ["tab", "pane"]
command = ["target/release/herdr-dwm-layout", "disable"]

[[actions]]
id = "split-right"
title = "DWM split right"
contexts = ["pane"]
command = ["target/release/herdr-dwm-layout", "split", "right"]

[[actions]]
id = "split-down"
title = "DWM split down"
contexts = ["pane"]
command = ["target/release/herdr-dwm-layout", "split", "down"]

[[actions]]
id = "swap-master"
title = "Swap with master"
contexts = ["pane"]
command = ["target/release/herdr-dwm-layout", "swap-master"]

[[actions]]
id = "next-layout"
title = "Toggle DWM orientation"
contexts = ["tab", "pane"]
command = ["target/release/herdr-dwm-layout", "next-layout"]

[[actions]]
id = "increase-nmaster"
title = "Increase master count"
contexts = ["tab", "pane"]
command = ["target/release/herdr-dwm-layout", "change-nmaster", "1"]

[[actions]]
id = "decrease-nmaster"
title = "Decrease master count"
contexts = ["tab", "pane"]
command = ["target/release/herdr-dwm-layout", "change-nmaster", "-1"]

[[actions]]
id = "increase-mfact"
title = "Grow master area"
contexts = ["tab", "pane"]
command = ["target/release/herdr-dwm-layout", "change-mfact", "0.05"]

[[actions]]
id = "decrease-mfact"
title = "Shrink master area"
contexts = ["tab", "pane"]
command = ["target/release/herdr-dwm-layout", "change-mfact", "-0.05"]

[[events]]
on = "pane.created"
command = ["target/release/herdr-dwm-layout", "event"]

[[events]]
on = "pane.closed"
command = ["target/release/herdr-dwm-layout", "event"]

[[events]]
on = "tab.closed"
command = ["target/release/herdr-dwm-layout", "event"]

